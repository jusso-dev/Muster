x-muster-environment: &muster-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://muster:muster@postgres:5432/muster
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_URL: http://localhost:3000
  AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-only-change-me-32-characters}
  AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
  AUTH_SECURE_COOKIES: "false"
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-1000}
  AUTH_SENSITIVE_RATE_LIMIT_MAX: ${AUTH_SENSITIVE_RATE_LIMIT_MAX:-100}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: muster-evidence
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-muster}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-local-minio-secret}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  KELPIE_BASE_URL: http://mock-kelpie:4011
  KELPIE_API_TOKEN: mock-kelpie-token
  TAWNY_BASE_URL: http://mock-tawny:4012
  TAWNY_API_TOKEN: mock-tawny-token
  BOWER_BASE_URL: http://mock-bower:4013
  BOWER_API_TOKEN: mock-bower-token
  MUSTER_MOCK_INTEGRATIONS: "true"

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
      POSTGRES_DB: muster
    volumes:
      - muster-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster -d muster"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.1-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - muster-redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-muster}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - muster-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-muster}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-minio-secret}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/muster-evidence &&
        mc version enable local/muster-evidence &&
        mc anonymous set none local/muster-evidence

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    image: muster:local
    build:
      context: .
      dockerfile: Dockerfile
    environment: *muster-environment
    command: ["sh", "-c", "pnpm --dir packages/database migrate && pnpm --dir packages/database seed && pnpm --dir apps/web start"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    image: muster:local
    environment: *muster-environment
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  agent-gateway:
    image: muster:local
    environment: *muster-environment
    command: ["node", "apps/agent-gateway/dist/index.js"]
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  mock-kelpie:
    image: node:24-bookworm-slim
    working_dir: /mock
    command: ["node", "mock.mjs"]
    environment:
      PORT: 4011
      MOCK_PRODUCT: Kelpie
    volumes:
      - ./integrations/kelpie/mock.mjs:/mock/mock.mjs:ro
    ports:
      - "4011:4011"

  mock-tawny:
    image: node:24-bookworm-slim
    working_dir: /mock
    command: ["node", "mock.mjs"]
    environment:
      PORT: 4012
      MOCK_PRODUCT: Tawny
    volumes:
      - ./integrations/tawny/mock.mjs:/mock/mock.mjs:ro
    ports:
      - "4012:4012"

  mock-bower:
    image: node:24-bookworm-slim
    working_dir: /mock
    command: ["node", "mock.mjs"]
    environment:
      PORT: 4013
      MOCK_PRODUCT: Bower
    volumes:
      - ./integrations/bower/mock.mjs:/mock/mock.mjs:ro
    ports:
      - "4013:4013"

volumes:
  muster-postgres:
  muster-redis:
  muster-minio:
